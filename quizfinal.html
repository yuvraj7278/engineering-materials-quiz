<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Exact Options (Questions Shuffled Only)</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --window-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border-color: #d2d2d7;
            --accent-blue: #0071e3;
            --accent-blue-hover: #0077ed;
            --correct-bg: #e3fcef;
            --correct-border: #34c759;
            --correct-text: #0c5c27;
            --wrong-bg: #fce8e8;
            --wrong-border: #ff3b30;
            --wrong-text: #8a0a14;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 740px;
            background: var(--window-bg);
            padding: 32px 36px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
        }

        h2 {
            margin-top: 0;
            font-size: 21px;
            font-weight: 600;
        }

        .subtext {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            width: 100%;
            text-align: left;
            padding: 13px 16px;
            font-size: 15px;
            background: var(--window-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--text-main);
        }

        .btn:hover:not(:disabled) {
            background: var(--bg-color);
            border-color: #a1a1a6;
        }

        .btn:disabled {
            cursor: default;
        }

        .correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .wrong {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .action-btn {
            text-align: center;
            background: var(--accent-blue);
            color: white;
            border: none;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
        }

        .action-btn:hover {
            background: var(--accent-blue-hover);
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 16px;
        }

        .topic-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            font-size: 14px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-main);
        }

        .topic-btn:hover {
            background: var(--bg-color);
            border-color: var(--accent-blue);
        }

        .badge {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .feedback {
            margin-top: 16px;
            font-weight: 600;
            font-size: 15px;
            text-align: center;
        }

        .score-display {
            font-size: 20px;
            font-weight: 600;
            margin: 24px 0;
        }

        .hidden {
            display: none !important;
        }

        #selection-screen, #result-screen {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="selection-screen">
        <h2>Quiz Bank (Exact Options • Random Question Order)</h2>
        <p class="subtext">Options stay in their exact original order; only the order of questions is randomized.</p>

        <button class="btn action-btn" onclick="startQuiz('ALL')" style="margin-top: 0; font-size: 16px; padding: 15px;">

        </button>

        <div class="topic-grid">

            <button class="topic-btn" onclick="startQuiz('CO6')"><span>CO6</span><span class="badge">22 Qs</span></button>
        </div>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="status-bar">
            <span id="progress">Question 1 / 140</span>
            <span id="co-tag">CO1</span>
            <span id="score-tracker">Score: 0</span>
        </div>

        <h2 id="question-text">Loading...</h2>
        <div class="options" id="options-container"></div>
        <div id="feedback-message" class="feedback hidden"></div>

        <button id="next-btn" class="btn action-btn hidden">Next Question</button>
        <button class="btn" onclick="goToSelection()" style="margin-top: 10px; background: transparent; border: none; color: var(--text-muted); text-align: center;">
            ← Back to Selection
        </button>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Quiz Complete</h2>
        <div id="final-score" class="score-display"></div>
        <button id="retry-btn" class="btn action-btn hidden">Retry Incorrect Questions</button>
        <button class="btn action-btn" onclick="goToSelection()" style="background: var(--text-main); margin-top: 10px;">
            Choose Another Set
        </button>
    </div>
</div>

let currentPool = [];
let wrongQuestions = [];
let currentIndex = 0;
let score = 0;

const selectionScreen = document.getElementById('selection-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');
const progressEl = document.getElementById('progress');
const coTagEl = document.getElementById('co-tag');
const scoreTrackerEl = document.getElementById('score-tracker');
const questionTextEl = document.getElementById('question-text');
const optionsContainerEl = document.getElementById('options-container');
const feedbackMessageEl = document.getElementById('feedback-message');
const nextBtn = document.getElementById('next-btn');
const retryBtn = document.getElementById('retry-btn');

// Shuffles ONLY the order of questions; option order inside each question is preserved.
function shuffleQuestions(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function startQuiz(filterCO) {
    const baseList = (filterCO === 'ALL')
        ? quizData
        : quizData.filter(item => item.co === filterCO);

    currentPool = shuffleQuestions(baseList);
    wrongQuestions = [];
    currentIndex = 0;
    score = 0;

    selectionScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    quizScreen.classList.remove('hidden');

    loadQuestion();
}

function goToSelection() {
    quizScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    selectionScreen.classList.remove('hidden');
}

function loadQuestion() {
    nextBtn.classList.add('hidden');
    feedbackMessageEl.classList.add('hidden');
    feedbackMessageEl.textContent = '';
    optionsContainerEl.innerHTML = '';

    const item = currentPool[currentIndex];
    progressEl.textContent = `Question ${currentIndex + 1} / ${currentPool.length}`;
    coTagEl.textContent = `${item.co} (#${item.num})`;
    scoreTrackerEl.textContent = `Score: ${score}`;
    questionTextEl.textContent = `${currentIndex + 1}. ${item.q}`;

    // Render options in their exact original order (no shuffling of options)
    item.opts.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        const letter = String.fromCharCode(65 + idx);
        btn.textContent = `${letter}) ${optText}`;
        btn.onclick = () => selectOption(idx, btn);
        optionsContainerEl.appendChild(btn);
    });
}

function selectOption(selectedIdx, selectedBtn) {
    const item = currentPool[currentIndex];
    const allBtns = optionsContainerEl.querySelectorAll('.btn');
    allBtns.forEach(b => b.disabled = true);

    feedbackMessageEl.classList.remove('hidden');

    if (selectedIdx === item.ans) {
        selectedBtn.classList.add('correct');
        score++;
        scoreTrackerEl.textContent = `Score: ${score}`;
        feedbackMessageEl.textContent = '✅ Correct!';
        feedbackMessageEl.style.color = 'var(--correct-text)';
    } else {
        selectedBtn.classList.add('wrong');
        if (allBtns[item.ans]) {
            allBtns[item.ans].classList.add('correct');
        }
        feedbackMessageEl.textContent = `❌ Incorrect — Answer: ${item.ansText}`;
        feedbackMessageEl.style.color = 'var(--wrong-text)';
        if (!wrongQuestions.includes(item)) {
            wrongQuestions.push(item);
        }
    }

    nextBtn.classList.remove('hidden');
}

nextBtn.onclick = () => {
    currentIndex++;
    if (currentIndex < currentPool.length) {
        loadQuestion();
    } else {
        showResults();
    }
};

function showResults() {
    quizScreen.classList.add('hidden');
    resultScreen.classList.remove('hidden');

    document.getElementById('final-score').innerHTML =
        `You scored <span style="color: var(--accent-blue);">${score}</span> out of ${currentPool.length}`;

    if (wrongQuestions.length > 0) {
        retryBtn.classList.remove('hidden');
        retryBtn.textContent = `Retry ${wrongQuestions.length} Incorrect Question(s)`;
    } else {
        retryBtn.classList.add('hidden');
    }
}

retryBtn.onclick = () => {
    currentPool = shuffleQuestions(wrongQuestions);
    wrongQuestions = [];
    currentIndex = 0;
    score = 0;
    resultScreen.classList.add('hidden');
    quizScreen.classList.remove('hidden');
    loadQuestion();
};
</script>
