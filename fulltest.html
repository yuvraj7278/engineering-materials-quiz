<head>
    <meta charset="UTF-8">

    <title>30 Marks Full Mock Test</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --window-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border-color: #d2d2d7;
            --accent-blue: #0071e3;
            --accent-blue-hover: #0077ed;
            --correct-bg: #e3fcef;
            --correct-border: #34c759;
            --correct-text: #0c5c27;
            --wrong-bg: #fce8e8;
            --wrong-border: #ff3b30;
            --wrong-text: #8a0a14;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 680px;
            background: var(--window-bg);
            padding: 32px 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .timer-box {
            color: var(--wrong-border);
            font-weight: 700;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            width: 100%;
            text-align: left;
            padding: 14px 18px;
            font-size: 15px;
            background: var(--window-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .btn:hover:not(:disabled) {
            background: var(--bg-color);
            border-color: #a1a1a6;
        }

        .btn:disabled {
            cursor: default;
        }

        .correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
        }

        .wrong {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .action-btn {
            text-align: center;
            background: var(--accent-blue);
            color: white;
            border: none;
            font-weight: 600;
            margin-top: 24px;
        }

        .action-btn:hover {
            background: var(--accent-blue-hover);
        }

        .hidden { display: none !important; }
        .feedback { margin-top: 18px; font-weight: 600; text-align: center; }
        #result-screen { text-align: center; }
        .score-display { font-size: 24px; font-weight: 700; margin: 24px 0; }
    </style>
</head>

<div class="container">
    <a href="index.html" style="text-decoration: none; color: #0071e3; font-weight: 600; font-size: 14px; display: inline-block; margin-bottom: 16px;">← Back to Main Menu</a>

        <h2 id="question-text" style="font-size: 20px; margin-top: 0;">Loading...</h2>
        
        <div class="options" id="options-container"></div>
        <div id="feedback-message" class="feedback hidden"></div>
        
        <button id="next-btn" class="btn action-btn hidden">Next Question</button>
    </div>

    <!-- Result Screen -->

        <p id="time-taken-info" style="color: var(--text-muted);"></p>

    let currentPool = [];
    let wrongQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timerInterval = null;
    let secondsLeft = 90 * 60; // 90 Minutes

    // Advanced Randomizer (Fisher-Yates) for perfect shuffling
    function shuffleAndSlice(array, count) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr.slice(0, count);
    }

    function build30MarkTest() {
        // Sample exactly 10 random questions from each massive bank
        const q1 = shuffleAndSlice(unit1Bank, 10).map(item => ({...item, unit: "Unit 1"}));
        const q2 = shuffleAndSlice(unit2Bank, 10).map(item => ({...item, unit: "Unit 2"}));
        const q3 = shuffleAndSlice(unit3Bank, 10).map(item => ({...item, unit: "Unit 3"}));
        
        // Combine the 30 questions and shuffle them so the units are mixed together
        return shuffleAndSlice([...q1, ...q2, ...q3], 30);
    }

    function startTimer() {
        clearInterval(timerInterval);
        secondsLeft = 90 * 60;
        
        timerInterval = setInterval(() => {
            secondsLeft--;
            let mins = Math.floor(secondsLeft / 60);
            let secs = secondsLeft % 60;
            document.getElementById('timer').textContent = 
                `${mins}:${secs < 10 ? '0' : ''}${secs}`;

            if (secondsLeft <= 0) {
                clearInterval(timerInterval);
                endQuiz(true); // Auto submit on timeout
            }
        }, 1000);
    }

    function startTest() {
        currentPool = build30MarkTest();
        wrongQuestions = [];
        currentQuestionIndex = 0;
        score = 0;
        
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        
        startTimer();
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('feedback-message').classList.add('hidden');
        
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        
        const qData = currentPool[currentQuestionIndex];
        
        document.getElementById('progress').textContent = `Question ${currentQuestionIndex + 1} / ${currentPool.length}`;
        document.getElementById('score-tracker').textContent = `Score: ${score}`;
        document.getElementById('unit-tag').textContent = qData.unit;
        document.getElementById('question-text').innerHTML = `${currentQuestionIndex + 1}. ${qData.q}`;

        qData.opts.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerHTML = `${String.fromCharCode(65 + index)}. ${opt}`;
            btn.onclick = () => checkAnswer(index, btn);
            optsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, selectedBtn) {
        const qData = currentPool[currentQuestionIndex];
        const correctIndex = qData.ans;
        const allBtns = document.getElementById('options-container').querySelectorAll('.btn');
        const feedback = document.getElementById('feedback-message');

        allBtns.forEach(btn => btn.disabled = true);
        feedback.classList.remove('hidden');

        if (selectedIndex === correctIndex) {
            selectedBtn.classList.add('correct');
            feedback.textContent = "✅ Correct!";
            feedback.style.color = "var(--correct-text)";
            score++;
            document.getElementById('score-tracker').textContent = `Score: ${score}`;
        } else {
            selectedBtn.classList.add('wrong');
            allBtns[correctIndex].classList.add('correct');
            feedback.textContent = "❌ Incorrect.";
            feedback.style.color = "var(--wrong-text)";
            
            if (!wrongQuestions.includes(qData)) {
                wrongQuestions.push(qData);
            }
        }
        
        document.getElementById('next-btn').classList.remove('hidden');
    }

    document.getElementById('next-btn').onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentPool.length) {
            loadQuestion();
        } else {
            endQuiz(false);
        }
    };

    function endQuiz(timeExpired) {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        const finalScore = document.getElementById('final-score');
        const timeTakenInfo = document.getElementById('time-taken-info');

        let totalTimeSpent = (90 * 60) - secondsLeft;
        let minsSpent = Math.floor(totalTimeSpent / 60);
        let secsSpent = totalTimeSpent % 60;

        finalScore.innerHTML = `Final Score: <span style="color: var(--accent-blue);">${score} / 30</span> Marks`;
        
        if (timeExpired) {
            timeTakenInfo.textContent = "⏰ Time's up! The test was automatically submitted.";
        } else {
            timeTakenInfo.textContent = `Completed in ${minsSpent} minute(s) and ${secsSpent} second(s).`;
        }

        const retryBtn = document.getElementById('retry-btn');
        if (wrongQuestions.length > 0) {
            retryBtn.classList.remove('hidden');
            retryBtn.textContent = `Review ${wrongQuestions.length} Missed Questions`;
        } else {
            retryBtn.classList.add('hidden');
        }
    }

    document.getElementById('restart-btn').onclick = startTest;
    
    // Start automatically when page loads
    startTest();
</script>
