<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Marks Full Mock Test</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --window-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border-color: #d2d2d7;
            --accent-blue: #0071e3;
            --accent-blue-hover: #0077ed;
            --correct-bg: #e3fcef;
            --correct-border: #34c759;
            --correct-text: #0c5c27;
            --wrong-bg: #fce8e8;
            --wrong-border: #ff3b30;
            --wrong-text: #8a0a14;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 680px;
            background: var(--window-bg);
            padding: 32px 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .timer-box {
            color: var(--wrong-border);
            font-weight: 700;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            width: 100%;
            text-align: left;
            padding: 14px 18px;
            font-size: 15px;
            background: var(--window-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .btn:hover:not(:disabled) {
            background: var(--bg-color);
            border-color: #a1a1a6;
        }

        .btn:disabled {
            cursor: default;
        }

        .correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
        }

        .wrong {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .action-btn {
            text-align: center;
            background: var(--accent-blue);
            color: white;
            border: none;
            font-weight: 600;
            margin-top: 24px;
        }

        .action-btn:hover {
            background: var(--accent-blue-hover);
        }

        .hidden { display: none !important; }
        .feedback { margin-top: 18px; font-weight: 600; text-align: center; }
        #result-screen { text-align: center; }
        .score-display { font-size: 24px; font-weight: 700; margin: 24px 0; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="text-decoration: none; color: #0071e3; font-weight: 600; font-size: 14px; display: inline-block; margin-bottom: 16px;">← Back to Main Menu</a>

    <!-- Quiz Screen -->
    <div id="quiz-screen">
        <div class="status-bar">
            <span id="progress">Question 1 / 30</span>
            <span class="timer-box">Time Left: <span id="timer">90:00</span></span>
            <span id="score-tracker">Score: 0</span>
        </div>
        
        <div id="unit-tag" style="font-size: 12px; font-weight: 700; color: #0071e3; text-transform: uppercase; margin-bottom: 6px;"></div>
        <h2 id="question-text" style="font-size: 20px; margin-top: 0;">Loading...</h2>
        
        <div class="options" id="options-container"></div>
        <div id="feedback-message" class="feedback hidden"></div>
        
        <button id="next-btn" class="btn action-btn hidden">Next Question</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
        <h2>Test Completed!</h2>
        <div id="final-score" class="score-display"></div>
        <p id="time-taken-info" style="color: var(--text-muted);"></p>
        
        <button id="retry-btn" class="btn action-btn hidden">Review Incorrect Questions</button>
        <button id="restart-btn" class="btn action-btn" style="background: var(--text-main); margin-top: 12px;">Start New 30 Marks Test</button>
    </div>
</div>

<script>
    // Master banks from Units 1, 2, and 3
    const unit1Bank = [
        { q: "Ferrous Metals do not possess the following property", opts: ["stiffness", "strength", "elasticity", "high electrical conductivity"], ans: 3 },
        { q: "Ceramics usually consist of", opts: ["oxides", "nitrides", "carbides & borides", "all of the above"], ans: 3 },
        { q: "out of the following which is not a example of ceramics.", opts: ["sand", "brick", "lubricants", "concrete"], ans: 2 },
        { q: "Density of Aluminium is", opts: ["2.7 gm/cc", "1.7 gm/cc", "3.7 gm/cc", "4.7 gm/cc"], ans: 0 },
        { q: "Melting point of copper is", opts: ["1539 deg. Celcius", "1031 deg. Celcius", "1231 deg. Celcius", "659 deg. Celcius"], ans: 1 },
        { q: "is the most malleable metal.", opts: ["Silver", "Gold", "Steel", "C.I."], ans: 1 },
        { q: "is lack of ductility.", opts: ["Malleability", "Hardness", "Toughness", "Brittleness"], ans: 3 },
        { q: "Melting point of iron is", opts: ["1131 deg. Celcius", "1539 deg. Celcius", "1659 deg. Celcius", "1712 deg. Celcius"], ans: 1 },
        { q: "is a brittle material.", opts: ["Steel", "aluminium", "Cast iron", "Copper"], ans: 2 },
        { q: "hardness is resistance to", opts: ["deformation", "plasticity", "elasticity", "penetration"], ans: 3 },
        { q: "fatigue failure occurs when a material is subjected to Loads", opts: ["fluctuating", "compressive", "tensile", "shear"], ans: 0 },
        { q: "is defined as the destruction of the material by chemical or electrochemical reaction with its environment.", opts: ["hardness", "melting point", "corrosion", "machining"], ans: 2 }
    ];

    const unit2Bank = [
        { q: "What is the crystalline structure of alpha iron?", opts: ["F.C.C.", "B.C.C.", "H.C.P.", "Amorphous"], ans: 1 },
        { q: "What is the structure of gamma iron?", opts: ["B.C.C.", "F.C.C.", "H.C.P.", "Simple Cubic"], ans: 1 },
        { q: "What is the melting point of pure iron?", opts: ["910°C", "1404°C", "1539°C", "1600°C"], ans: 2 },
        { q: "In a solid solution, the metal present in larger quantity is called:", opts: ["Solute", "Solvent", "Precipitate", "Alloy"], ans: 1 },
        { q: "The eutectoid composition in the iron-carbon diagram is:", opts: ["0.8% C", "4.3% C", "2.0% C", "6.67% C"], ans: 0 },
        { q: "The eutectoid temperature in the iron-carbon diagram is:", opts: ["1495°C", "1147°C", "723°C", "1130°C"], ans: 2 },
        { q: "Which of the following phases is soft and ductile?", opts: ["Cementite", "Pearlite", "Ferrite", "Martensite"], ans: 2 },
        { q: "The phase Fe3C is known as:", opts: ["Austenite", "Cementite", "Pearlite", "Bainite"], ans: 1 },
        { q: "Steel Contains Carbon percentage between:", opts: ["0 to 1.1%", "0 to 2.1%", "0 to 4.1%", "0 to 3.1%"], ans: 1 }
    ];

    const unit3Bank = [
        { q: "Ferritic stainless steel contain", opts: ["12 to 18% Chromium", "13 to 27% Chromium", "Above 18% Chromium", "None"], ans: 1 },
        { q: "Austenitic stainless steel contain", opts: ["12 to 18% Chromium", "13 to 27% Chromium", "Above 18% Chromium", "None"], ans: 2 },
        { q: "Brass is an alloy of", opts: ["copper and zinc", "copper and tin", "copper, tin and zinc", "none"], ans: 0 },
        { q: "An alloy of copper, tin and zinc is known as", opts: ["Brass", "Bronze", "gun metal", "muntz metal"], ans: 1 },
        { q: "Copper has high electrical & thermal conductivity.", opts: ["true", "false", "don't know", "can't say"], ans: 0 },
        { q: "The alloy, mainly used for corrosion resistance in stainless steels is", opts: ["silicon", "manganese", "carbon", "chromium"], ans: 3 },
        { q: "German silver contains", opts: ["1% silver", "2% silver", "5% silver", "no silver"], ans: 3 },
        { q: "Bronze is the alloy of----.", opts: ["copper and tin", "copper and zinc", "copper and iron", "tin and zinc"], ans: 0 }
    ];

    let currentPool = [];
    let wrongQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timerInterval = null;
    let secondsLeft = 90 * 60; // 90 Minutes

    function getRandomSample(arr, count) {
        let shuffled = [...arr].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
    }

    function build30MarkTest() {
        // Sample 10 from each unit
        const q1 = getRandomSample(unit1Bank, 10).map(item => ({...item, unit: "Unit 1"}));
        const q2 = getRandomSample(unit2Bank, 10).map(item => ({...item, unit: "Unit 2"}));
        const q3 = getRandomSample(unit3Bank, 10).map(item => ({...item, unit: "Unit 3"}));
        
        // Combine & shuffle all 30
        return [...q1, ...q2, ...q3].sort(() => 0.5 - Math.random());
    }

    function startTimer() {
        clearInterval(timerInterval);
        secondsLeft = 90 * 60;
        
        timerInterval = setInterval(() => {
            secondsLeft--;
            let mins = Math.floor(secondsLeft / 60);
            let secs = secondsLeft % 60;
            document.getElementById('timer').textContent = 
                `${mins}:${secs < 10 ? '0' : ''}${secs}`;

            if (secondsLeft <= 0) {
                clearInterval(timerInterval);
                endQuiz(true); // Auto submit on timeout
            }
        }, 1000);
    }

    function startTest() {
        currentPool = build30MarkTest();
        wrongQuestions = [];
        currentQuestionIndex = 0;
        score = 0;
        
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        
        startTimer();
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('feedback-message').classList.add('hidden');
        
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        
        const qData = currentPool[currentQuestionIndex];
        
        document.getElementById('progress').textContent = `Question ${currentQuestionIndex + 1} / ${currentPool.length}`;
        document.getElementById('score-tracker').textContent = `Score: ${score}`;
        document.getElementById('unit-tag').textContent = qData.unit;
        document.getElementById('question-text').innerHTML = `${currentQuestionIndex + 1}. ${qData.q}`;

        qData.opts.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerHTML = `${String.fromCharCode(65 + index)}. ${opt}`;
            btn.onclick = () => checkAnswer(index, btn);
            optsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, selectedBtn) {
        const qData = currentPool[currentQuestionIndex];
        const correctIndex = qData.ans;
        const allBtns = document.getElementById('options-container').querySelectorAll('.btn');
        const feedback = document.getElementById('feedback-message');

        allBtns.forEach(btn => btn.disabled = true);
        feedback.classList.remove('hidden');

        if (selectedIndex === correctIndex) {
            selectedBtn.classList.add('correct');
            feedback.textContent = "✅ Correct!";
            feedback.style.color = "var(--correct-text)";
            score++;
            document.getElementById('score-tracker').textContent = `Score: ${score}`;
        } else {
            selectedBtn.classList.add('wrong');
            allBtns[correctIndex].classList.add('correct');
            feedback.textContent = "❌ Incorrect.";
            feedback.style.color = "var(--wrong-text)";
            
            if (!wrongQuestions.includes(qData)) {
                wrongQuestions.push(qData);
            }
        }
        
        document.getElementById('next-btn').classList.remove('hidden');
    }

    document.getElementById('next-btn').onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentPool.length) {
            loadQuestion();
        } else {
            endQuiz(false);
        }
    };

    function endQuiz(timeExpired) {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        const finalScore = document.getElementById('final-score');
        const timeTakenInfo = document.getElementById('time-taken-info');

        let totalTimeSpent = (90 * 60) - secondsLeft;
        let minsSpent = Math.floor(totalTimeSpent / 60);
        let secsSpent = totalTimeSpent % 60;

        finalScore.innerHTML = `Final Score: <span style="color: var(--accent-blue);">${score} / 30</span> Marks`;
        
        if (timeExpired) {
            timeTakenInfo.textContent = "⏰ Time's up! The test was automatically submitted.";
        } else {
            timeTakenInfo.textContent = `Completed in ${minsSpent} minute(s) and ${secsSpent} second(s).`;
        }

        const retryBtn = document.getElementById('retry-btn');
        if (wrongQuestions.length > 0) {
            retryBtn.classList.remove('hidden');
            retryBtn.textContent = `Review ${wrongQuestions.length} Missed Questions`;
        } else {
            retryBtn.classList.add('hidden');
        }
    }

    document.getElementById('restart-btn').onclick = startTest;
    
    // Start automatically when page loads
    startTest();
</script>
</body>
</html>
