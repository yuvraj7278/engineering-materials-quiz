    let currentPool = [];
    let wrongQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    const selectionScreen = document.getElementById('selection-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const progress = document.getElementById('progress');
    const scoreTracker = document.getElementById('score-tracker');
    const feedbackMessage = document.getElementById('feedback-message');
    const retryBtn = document.getElementById('retry-btn');

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startQuiz(topic) {
        if (topic === 'all') {
            currentPool = shuffleArray(masterQuestionBank);
        } else {
            const filtered = masterQuestionBank.filter(q => q.cat === topic);
            currentPool = shuffleArray(filtered);
        }
        
        wrongQuestions = [];
        currentQuestionIndex = 0;
        score = 0;
        
        selectionScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        
        loadQuestion();
    }

    function goToSelection() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        selectionScreen.classList.remove('hidden');
    }

    function loadQuestion() {
        nextBtn.classList.add('hidden');
        feedbackMessage.classList.add('hidden');
        optionsContainer.innerHTML = '';
        
        const qData = currentPool[currentQuestionIndex];
        
        progress.textContent = `Question ${currentQuestionIndex + 1} of ${currentPool.length}`;
        scoreTracker.textContent = `Score: ${score}`;
        questionText.innerHTML = `${currentQuestionIndex + 1}. ${qData.q}`;

        qData.opts.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerHTML = `${String.fromCharCode(65 + index)}. ${opt}`;
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, selectedBtn) {
        const qData = currentPool[currentQuestionIndex];
        const correctIndex = qData.ans;
        const allBtns = optionsContainer.querySelectorAll('.btn');

        allBtns.forEach(btn => btn.disabled = true);
        feedbackMessage.classList.remove('hidden');

        if (selectedIndex === correctIndex) {
            selectedBtn.classList.add('correct');
            feedbackMessage.textContent = "✅ Correct!";
            feedbackMessage.style.color = "var(--correct-text)";
            score++;
            scoreTracker.textContent = `Score: ${score}`;
        } else {
            selectedBtn.classList.add('wrong');
            allBtns[correctIndex].classList.add('correct');
            feedbackMessage.textContent = "❌ Incorrect.";
            feedbackMessage.style.color = "var(--wrong-text)";
            
            if (!wrongQuestions.includes(qData)) {
                wrongQuestions.push(qData);
            }
        }
        nextBtn.classList.remove('hidden');
    }

    nextBtn.onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentPool.length) {
            loadQuestion();
        } else {
            endQuiz();
        }
    };

    function endQuiz() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        
        document.getElementById('final-score').innerHTML = 
            `You scored <span style="color: var(--accent-blue);">${score}</span> out of ${currentPool.length}!`;

        if (wrongQuestions.length > 0) {
            retryBtn.classList.remove('hidden');
            retryBtn.textContent = `Review ${wrongQuestions.length} Incorrect Question(s)`;
        } else {
            retryBtn.classList.add('hidden');
            document.getElementById('final-score').innerHTML += "<br><br>🎉 Perfect score! Excellent work.";
        }
    }

    retryBtn.onclick = () => {
        currentPool = shuffleArray(wrongQuestions);
        wrongQuestions = [];
        currentQuestionIndex = 0;
        score = 0;
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        loadQuestion();
    };
