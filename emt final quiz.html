<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMT Quiz - Units 4, 5 & 6 (Exact 72 Qs)</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --window-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border-color: #d2d2d7;
            --accent-blue: #0071e3;
            --accent-blue-hover: #0077ed;
            --correct-bg: #e3fcef;
            --correct-border: #34c759;
            --correct-text: #0c5c27;
            --wrong-bg: #fce8e8;
            --wrong-border: #ff3b30;
            --wrong-text: #8a0a14;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 720px;
            background: var(--window-bg);
            padding: 32px 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            width: 100%;
            text-align: left;
            padding: 14px 18px;
            font-size: 15px;
            background: var(--window-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            color: var(--text-main);
        }

        .btn:hover:not(:disabled) {
            background: var(--bg-color);
            border-color: #a1a1a6;
        }

        .btn:disabled {
            cursor: default;
        }

        .correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 500;
        }

        .wrong {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .action-btn {
            text-align: center;
            background: var(--accent-blue);
            color: white;
            border: none;
            font-weight: 600;
            margin-top: 24px;
            box-shadow: 0 2px 5px rgba(0, 113, 227, 0.3);
        }

        .action-btn:hover {
            background: var(--accent-blue-hover);
        }

        .hidden {
            display: none !important;
        }

        .feedback {
            margin-top: 18px;
            font-weight: 600;
            font-size: 15px;
            text-align: center;
        }

        #selection-screen, #result-screen {
            text-align: center;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
            text-align: left;
        }

        .topic-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            font-size: 15px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .topic-btn:hover {
            background: var(--bg-color);
            border-color: var(--accent-blue);
        }

        .badge {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .score-display {
            font-size: 20px;
            font-weight: 600;
            margin: 24px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Selection Screen -->
    <div id="selection-screen">
        <h2>EMT Test Bank Quiz Selection</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">All 72 exact questions (Unit 4: 21 Qs, Unit 5: 31 Qs, Unit 6: 20 Qs) strictly included without omissions.</p>
        
        <button class="action-btn btn" onclick="startQuiz('all')" style="margin-top: 0; font-size: 16px; padding: 16px;">🚀 Attempt Full Test Bank (72 Questions)</button>
        
        <div class="topic-grid">
            <button class="topic-btn" onclick="startQuiz('Unit 4: Heat Treatment')">
                <span>Unit 4: Heat Treatment</span>
                <span class="badge">21 Qs</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('Unit 5: Powder Metallurgy')">
                <span>Unit 5: Powder Metallurgy</span>
                <span class="badge">31 Qs</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('Unit 6: Refractories & Fuels')">
                <span>Unit 6: Refractories & Fuels</span>
                <span class="badge">20 Qs</span>
            </button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
        <div class="status-bar">
            <span id="progress">Question 1 / 72</span>
            <span id="score-tracker">Score: 0</span>
        </div>
        
        <h2 id="question-text">Question loading...</h2>
        
        <div class="options" id="options-container"></div>
        
        <div id="feedback-message" class="feedback hidden"></div>
        
        <button id="next-btn" class="btn action-btn hidden">Next Question</button>
        <button onclick="goToSelection()" class="btn" style="margin-top: 12px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; text-align: center; width: 100%;">← Back to Topic Selection</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
        <h2>Quiz Complete</h2>
        <div id="final-score" class="score-display"></div>
        
        <button id="retry-btn" class="btn action-btn hidden">Resolve Incorrect Questions</button>
        <button onclick="goToSelection()" class="btn action-btn" style="background: var(--text-main); margin-top: 12px;">Choose Another Topic</button>
    </div>
</div>
