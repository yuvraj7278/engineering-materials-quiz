<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMT Test Bank Quiz (Units 4, 5 & 6)</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --window-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border-color: #d2d2d7;
            --accent-blue: #0071e3;
            --accent-blue-hover: #0077ed;
            --correct-bg: #e3fcef;
            --correct-border: #34c759;
            --correct-text: #0c5c27;
            --wrong-bg: #fce8e8;
            --wrong-border: #ff3b30;
            --wrong-text: #8a0a14;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 720px;
            background: var(--window-bg);
            padding: 32px 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            width: 100%;
            text-align: left;
            padding: 14px 18px;
            font-size: 15px;
            background: var(--window-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            color: var(--text-main);
        }

        .btn:hover:not(:disabled) {
            background: var(--bg-color);
            border-color: #a1a1a6;
        }

        .btn:disabled {
            cursor: default;
        }

        .correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 500;
        }

        .wrong {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .action-btn {
            text-align: center;
            background: var(--accent-blue);
            color: white;
            border: none;
            font-weight: 600;
            margin-top: 24px;
            box-shadow: 0 2px 5px rgba(0, 113, 227, 0.3);
            cursor: pointer;
        }

        .action-btn:hover {
            background: var(--accent-blue-hover);
        }

        .hidden {
            display: none !important;
        }

        .feedback {
            margin-top: 18px;
            font-weight: 600;
            font-size: 15px;
            text-align: center;
        }

        #selection-screen, #result-screen {
            text-align: center;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
            text-align: left;
        }

        .topic-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            font-size: 15px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .topic-btn:hover {
            background: var(--bg-color);
            border-color: var(--accent-blue);
        }

        .badge {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .score-display {
            font-size: 20px;
            font-weight: 600;
            margin: 24px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Selection Screen -->
    <div id="selection-screen">
        <h2>EMT Test Bank Quiz Selection</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Select a unit or practice the full question bank.</p>
        <a href="index.html" class="btn" style="margin-bottom: 16px; background: #f0f0f2; text-align: center; display: block; text-decoration: none;">← Back to Main Menu</a>
        
        <button class="action-btn btn" onclick="startQuiz('all')" style="margin-top: 0; font-size: 16px; padding: 16px;">🚀 Full Test Bank (72 Questions)</button>
        
        <div class="topic-grid">
            <button class="topic-btn" onclick="startQuiz('Unit 4: Heat Treatment')">

            <button class="topic-btn" onclick="startQuiz('Unit 5: Powder Metallurgy')">
                <span>Unit 5: Powder Metallurgy</span>
                <span class="badge">31 Qs</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('Unit 6: Refractories & Fuels')">
                <span>Unit 6: Refractories & Fuels</span>
                <span class="badge">20 Qs</span>
            </button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
        <div class="status-bar">
            <span id="progress">Question 1 / 72</span>
            <span id="score-tracker">Score: 0</span>
        </div>
        
        <h2 id="question-text">Question loading...</h2>
        
        <div class="options" id="options-container"></div>
        
        <div id="feedback-message" class="feedback hidden"></div>
        
        <button id="next-btn" class="btn action-btn hidden">Next Question</button>
        <button onclick="goToSelection()" class="btn" style="margin-top: 12px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; text-align: center; width: 100%;">← Back to Topic Selection</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
        <h2>Quiz Complete</h2>
        <div id="final-score" class="score-display"></div>
        
        <button id="retry-btn" class="btn action-btn hidden">Resolve Incorrect Questions</button>
        <button onclick="goToSelection()" class="btn action-btn" style="background: var(--text-main); margin-top: 12px;">Choose Another Topic</button>
    </div>
</div>

<script>

        // --- UNIT 5 (31 Questions) ---

        {"q": "A compacted powder component has insufficient strength after pressing. Which subsequent operation can significantly increase its strength?", "opts": ["A) Sintering", "B) Marking", "C) Drilling only", "D) Inspection only"], "ans": 0, "cat": "Unit 5: Powder Metallurgy"},
        {"q": "Which of the following is a major advantage of powder metallurgy?", "opts": ["A) High material wastage", "B) Ability to produce controlled porosity", "C) Necessity of melting every powder", "D) Very large machining allowance"], "ans": 1, "cat": "Unit 5: Powder Metallurgy"},
        {"q": "Which application is most directly associated with controlled porosity in powder metallurgy?", "opts": ["A) Self-lubricating bearing", "B) Solid steel shaft", "C) Welded frame", "D) Forged crankshaft"], "ans": 0, "cat": "Unit 5: Powder Metallurgy"},

    let currentPool = [];
    let wrongQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    const selectionScreen = document.getElementById('selection-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startQuiz(topic) {
        if (topic === 'all') {
            currentPool = shuffleArray(masterQuestionBank);
        } else {
            const filtered = masterQuestionBank.filter(q => q.cat === topic);
            currentPool = shuffleArray(filtered);
        }
        
        wrongQuestions = [];
        currentQuestionIndex = 0;
        score = 0;
        
        selectionScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        
        loadQuestion();
    }

    function goToSelection() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        selectionScreen.classList.remove('hidden');
    }

    function loadQuestion() {
        nextBtn.classList.add('hidden');
        feedbackMessage.classList.add('hidden');
        feedbackMessage.textContent = '';
        optionsContainer.innerHTML = '';
        
        const qData = currentPool[currentQuestionIndex];
        
        progress.textContent = `Question ${currentQuestionIndex + 1} of ${currentPool.length}`;
        scoreTracker.textContent = `Score: ${score}`;
        questionText.innerHTML = `${currentQuestionIndex + 1}. ${qData.q}`;

        qData.opts.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = opt;
            btn.onclick = function() {
                checkAnswer(index, btn);
            };
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, selectedBtn) {
        const qData = currentPool[currentQuestionIndex];
        const correctIndex = qData.ans;
        const allBtns = optionsContainer.querySelectorAll('.btn');

        allBtns.forEach(btn => btn.disabled = true);
        feedbackMessage.classList.remove('hidden');

        if (selectedIndex === correctIndex) {
            selectedBtn.classList.add('correct');
            feedbackMessage.textContent = "✅ Correct!";
            feedbackMessage.style.color = "var(--correct-text)";
            score++;
            scoreTracker.textContent = `Score: ${score}`;
        } else {
            selectedBtn.classList.add('wrong');
            allBtns[correctIndex].classList.add('correct');
            feedbackMessage.textContent = "❌ Incorrect.";
            feedbackMessage.style.color = "var(--wrong-text)";
            
            if (!wrongQuestions.includes(qData)) {
                wrongQuestions.push(qData);
            }
        }
        nextBtn.classList.remove('hidden');
    }

    nextBtn.onclick = function() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentPool.length) {
            loadQuestion();
        } else {
            endQuiz();
        }
    };

    function endQuiz() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        
        document.getElementById('final-score').innerHTML = 
            `You scored <span style="color: var(--accent-blue);">${score}</span> out of ${currentPool.length}!`;

        if (wrongQuestions.length > 0) {
            retryBtn.classList.remove('hidden');
            retryBtn.textContent = `Review ${wrongQuestions.length} Incorrect Question(s)`;
        } else {
            retryBtn.classList.add('hidden');
            document.getElementById('final-score').innerHTML += "<br><br>🎉 Perfect score! Excellent work.";
        }
    }

    retryBtn.onclick = function() {
        currentPool = shuffleArray(wrongQuestions);
        wrongQuestions = [];
        currentQuestionIndex = 0;
        score = 0;
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        loadQuestion();
    };
</script>
</body>
</html>
